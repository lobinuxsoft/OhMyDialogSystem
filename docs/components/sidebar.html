function generateSidebar(lang = 'es', currentPage = '') {
  const data = sidebarData[lang] || sidebarData.es;
  const otherLang = lang === 'es' ? 'en' : 'es';
  const langPrefix = '../';

  let html = `
    <div class="p-6 text-center border-b border-border-default mb-6">
      <div class="w-16 h-16 mx-auto mb-4">
        <img src="${langPrefix}logo-eldritch.png" alt="OhMyDialogSystem"
             class="w-full h-full drop-shadow-[0_0_10px_rgba(0,212,255,0.4)]">
      </div>
      <div class="text-gradient-cyan-purple text-lg font-bold uppercase tracking-wider">${data.title}</div>
      <div class="text-xs text-gray-500 uppercase tracking-widest mt-1">${data.subtitle}</div>
    </div>
  `;

  data.sections.forEach(section => {
    html += `
      <div class="mb-6">
        <div class="text-xs uppercase tracking-widest text-ai-purple mb-2 pl-2 flex items-center gap-2 font-mono">
          <span class="text-gray-600 text-[0.65rem]">//</span>
          ${section.title}
        </div>
        <ul class="list-none">
    `;

    section.links.forEach(link => {
      const isActive = currentPage && link.href.includes(currentPage);
      const target = link.external ? ' target="_blank"' : '';
      const activeClass = isActive
        ? 'bg-gradient-to-r from-ai-cyan/10 to-transparent text-ai-cyan border-l-2 border-ai-cyan shadow-glow-cyan'
        : 'text-gray-400 hover:bg-bg-tertiary hover:text-ai-cyan hover:pl-6 hover:shadow-[inset_3px_0_0_#00d4ff]';

      html += `
        <li>
          <a href="${link.href}"${target}
             class="flex items-center gap-2 py-2 px-4 rounded-md transition-all duration-200 text-sm ${activeClass}">
            <span class="opacity-70">${link.icon}</span>
            ${link.text}
          </a>
        </li>
      `;
    });

    html += `
        </ul>
      </div>
    `;
  });

  return html;
}

// Auto-initialize if sidebar element exists
document.addEventListener('DOMContentLoaded', function() {
  const sidebarEl = document.getElementById('sidebar-content');
  if (sidebarEl) {
    const lang = document.documentElement.lang || 'es';
    const currentPage = window.location.pathname.split('/').pop();
    sidebarEl.innerHTML = generateSidebar(lang, currentPage);
  }
});
