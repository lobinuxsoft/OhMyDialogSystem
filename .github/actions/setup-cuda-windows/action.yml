name: "Setup CUDA Toolkit (Windows)"
description: "Install CUDA Toolkit on Windows for llama.cpp compilation"

inputs:
  cuda-version:
    description: "CUDA version to install"
    required: false
    default: "12.4"

runs:
  using: "composite"
  steps:
    - name: Install CUDA Toolkit
      shell: pwsh
      run: |
        $CUDA_VERSION = "${{ inputs.cuda-version }}"
        $CUDA_VERSION_NODOT = $CUDA_VERSION -replace '\.', ''

        Write-Host "Installing CUDA Toolkit $CUDA_VERSION..."

        # Download CUDA installer
        $installerUrl = "https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}.0/network_installers/cuda_${CUDA_VERSION}.0_windows_network.exe"
        $installerPath = "$env:TEMP\cuda_installer.exe"

        Write-Host "Downloading from: $installerUrl"
        Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing

        # Install only the components needed for compilation
        $installArgs = @(
          "-s",
          "nvcc_${CUDA_VERSION}",
          "cudart_${CUDA_VERSION}",
          "cublas_${CUDA_VERSION}",
          "cublas_dev_${CUDA_VERSION}"
        )

        Write-Host "Installing CUDA components..."
        Start-Process -FilePath $installerPath -ArgumentList $installArgs -Wait -NoNewWindow

        # Add CUDA to PATH
        $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${CUDA_VERSION}"
        if (Test-Path $cudaPath) {
          Write-Host "CUDA installed at: $cudaPath"
          echo "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          Write-Error "CUDA installation failed - path not found"
          exit 1
        }

    - name: Verify CUDA installation
      shell: pwsh
      run: |
        nvcc --version
