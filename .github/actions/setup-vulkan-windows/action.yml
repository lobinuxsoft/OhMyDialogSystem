name: "Setup Vulkan SDK (Windows)"
description: "Install Vulkan SDK on Windows for llama.cpp compilation"

inputs:
  vulkan-version:
    description: "Vulkan SDK version to install"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Get Vulkan SDK version
      id: vulkan-version
      shell: pwsh
      run: |
        $version = "${{ inputs.vulkan-version }}"
        if ($version -eq "latest") {
          $version = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt" -UseBasicParsing).Content.Trim()
        }
        Write-Host "Vulkan SDK version: $version"
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK
        key: vulkan-sdk-windows-${{ steps.vulkan-version.outputs.version }}

    - name: Install Vulkan SDK
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $version = "${{ steps.vulkan-version.outputs.version }}"
        $installerUrl = "https://sdk.lunarg.com/sdk/download/${version}/windows/VulkanSDK-${version}-Installer.exe"
        $installerPath = "$env:TEMP\VulkanSDK-Installer.exe"

        Write-Host "Downloading Vulkan SDK from: $installerUrl"
        Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing

        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath $installerPath -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

    - name: Set Vulkan environment
      shell: pwsh
      run: |
        $version = "${{ steps.vulkan-version.outputs.version }}"
        $vulkanPath = "C:\VulkanSDK\$version"

        if (Test-Path $vulkanPath) {
          Write-Host "Vulkan SDK installed at: $vulkanPath"
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
          echo "$vulkanPath\Bin" >> $env:GITHUB_PATH
        } else {
          Write-Error "Vulkan SDK installation failed"
          exit 1
        }
